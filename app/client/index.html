<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquiStar</title>
    <meta name="description" content="Portfolio, holdings and P&L" />
    <!-- Tab identity. SVG first (scales cleanly to whatever the tab strip asks for), .ico as the
         fallback for anything that does not take SVG. Three rising bars with a spark above the
         tallest: the bars say equity, the spark says the STAR in the name and is what separates
         this tab from Equix's plain bars and Optix's violet ring. Checked at true 16px, where
         detail turns to mush and only the outline survives — the spark still reads there, which
         is why it sits clear of the bar rather than touching it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#00b981" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.jsx"></script>
  </head>

    <div id="root"></div>
  </body>
</html>
